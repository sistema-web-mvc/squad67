<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalhes do Item</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-5">
    <div class="container">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h3>Detalhes do Item</h3>
            </div>
            <div class="card-body">
                <p><strong>ID:</strong> <span th:text="${item.id}"></span></p>
                <p><strong>Nome:</strong> <span th:text="${item.nome}"></span></p>
                <p><strong>Descrição:</strong> <span th:text="${item.descricao}"></span></p>
                <p><strong>Preço:</strong> <span th:text="${'R$ ' + item.preco}"></span></p>
                <p><strong>Data de Cadastro:</strong> <span th:text="${item.dataCadastro}"></span></p>
                <p><strong>Ativo:</strong> <span th:text="${item.ativo ? 'Sim' : 'Não'}"></span></p>
                <a href="/itens" class="btn btn-secondary mt-3">Voltar para a Lista</a>
            </div>
        </div>
    </div>
</body>
</html>
