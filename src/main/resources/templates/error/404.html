<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<!-- O Spring Boot usa esta página sempre que a resposta for 404 (por exemplo, aviso que não existe). -->
<head th:replace="~{fragments/layout :: head('Página não encontrada')}"></head>
<body>

<a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>

<header th:replace="~{fragments/layout :: cabecalho('')}"></header>

<main id="conteudo" class="container secao">
    <h1>Não encontramos essa página</h1>
    <p class="secao__texto">O endereço pode estar errado, ou o aviso não existe mais.</p>
    <p>
        <a class="voltar" th:href="@{/avisos}">&larr; Ver os avisos</a>
        ·
        <a class="voltar" th:href="@{/}">Ir para o início</a>
    </p>
</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>

</body>
</html>
