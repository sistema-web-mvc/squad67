<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Avisos')}"></head>
<body class="d-flex flex-column min-vh-100">

<a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>

<header th:replace="~{fragments/layout :: cabecalho('avisos')}"></header>

<div th:replace="~{fragments/layout :: mensagens}"></div>

<main id="conteudo" class="container py-4 flex-grow-1">

    <div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-3">
        <div>
            <h1 class="h2 mb-1">Avisos</h1>
            <p class="text-body-secondary mb-0">
                Avisos que ainda estão valendo.
            </p>
        </div>
        <a class="btn btn-primary" th:href="@{/avisos/novo}">Novo aviso</a>
    </div>

    <form class="row g-2 align-items-end mb-3" method="get" th:action="@{/avisos}">
        <input th:if="${tipoSelecionado != null}" type="hidden" name="tipo" th:value="${tipoSelecionado.name()}">
        <div class="col-md-6">
            <label for="q" class="form-label">Buscar por título ou descrição</label>
            <input id="q" name="q" type="search" class="form-control" maxlength="150" th:value="${termoBusca}">
        </div>
        <div class="col-md-4">
            <label for="ordem" class="form-label">Ordenar por</label>
            <select id="ordem" name="ordem" class="form-select">
                <option value="recentes" th:selected="${ordemSelecionada == 'recentes'}">Mais recentes</option>
                <option value="titulo" th:selected="${ordemSelecionada == 'titulo'}">Título</option>
                <option value="expiracao" th:selected="${ordemSelecionada == 'expiracao'}">Data de expiração</option>
            </select>
        </div>
        <div class="col-md-2 d-grid">
            <button type="submit" class="btn btn-outline-primary">Buscar</button>
        </div>
    </form>

    <!-- Filtro por tipo: cada link recarrega a página com os filtros atuais. -->
    <nav aria-label="Filtrar avisos por tipo" class="mb-4">
        <ul class="nav nav-pills gap-1">
            <li class="nav-item">
                <a class="nav-link" th:href="@{/avisos(q=${termoBusca}, ordem=${ordemSelecionada})}"
                   th:classappend="${tipoSelecionado == null} ? 'active'"
                   th:attr="aria-current=${tipoSelecionado == null} ? 'true' : null">Todos</a>
            </li>
            <li class="nav-item" th:each="t : ${tipos}">
                <a class="nav-link" th:href="@{/avisos(tipo=${t.name()}, q=${termoBusca}, ordem=${ordemSelecionada})}"
                   th:classappend="${tipoSelecionado == t} ? 'active'"
                   th:attr="aria-current=${tipoSelecionado == t} ? 'true' : null"
                   th:text="${t.rotulo}">Tipo</a>
            </li>
        </ul>
    </nav>

    <p class="border border-2 border-dashed rounded p-4 text-body-secondary"
       th:if="${#lists.isEmpty(avisos)}">
        Nenhum aviso valendo agora para este filtro.
    </p>

    <ul class="list-unstyled d-grid gap-3" th:unless="${#lists.isEmpty(avisos)}">
        <li class="card" th:each="aviso : ${avisos}">
            <div class="card-body">
                <span class="badge text-bg-primary mb-2" th:text="${aviso.tipo().rotulo}">Tipo</span>
                <h2 class="h5 card-title">
                    <a class="link-body-emphasis" th:href="@{/avisos/{id}(id=${aviso.id()})}"
                       th:text="${aviso.titulo()}">Título do aviso</a>
                </h2>
                <p class="card-text text-body-secondary small mb-2">
                    <span th:text="${aviso.escopo()}">Turma</span>
                    <span th:if="${aviso.espaco() != null}">
                        · <span th:text="${aviso.espaco()}">Sala</span>
                    </span>
                    · <span th:text="${aviso.criadoEmFormatado()}">01/01/2026 08:00</span>
                    <span th:if="${aviso.confirmacoes() > 0}"
                          th:text="${aviso.confirmacoes() == 1 ? ' · 1 pessoa confirmou' : ' · ' + aviso.confirmacoes() + ' pessoas confirmaram'}">
                        · 2 pessoas confirmaram
                    </span>
                </p>
                <a class="btn btn-sm btn-outline-secondary"
                   th:href="@{/avisos/{id}/editar(id=${aviso.id()})}"
                   th:attr="aria-label=${'Editar o aviso ' + aviso.titulo()}">Editar</a>
            </div>
        </li>
    </ul>

</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>

<script th:replace="~{fragments/layout :: scripts}"></script>

</body>
</html>
