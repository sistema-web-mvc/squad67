<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Avisos')}"></head>
<body>

<a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>

<header th:replace="~{fragments/layout :: cabecalho('avisos')}"></header>

<main id="conteudo" class="container secao">

    <h1>Avisos</h1>
    <p class="secao__texto">Só aparecem os avisos que ainda estão valendo, do mais novo para o mais antigo.</p>

    <!-- Filtro por tipo: cada link recarrega a página com ?tipo=... -->
    <nav aria-label="Filtrar avisos por tipo">
        <ul class="filtros">
            <li>
                <a class="filtro" th:href="@{/avisos}"
                   th:classappend="${tipoSelecionado == null} ? 'filtro--ativo'"
                   th:attr="aria-current=${tipoSelecionado == null} ? 'true' : null">Todos</a>
            </li>
            <li th:each="t : ${tipos}">
                <a class="filtro" th:href="@{/avisos(tipo=${t.name()})}"
                   th:classappend="${tipoSelecionado == t} ? 'filtro--ativo'"
                   th:attr="aria-current=${tipoSelecionado == t} ? 'true' : null"
                   th:text="${t.rotulo}">Tipo</a>
            </li>
        </ul>
    </nav>

    <p class="vazio" th:if="${#lists.isEmpty(avisos)}">
        Nenhum aviso valendo agora para este filtro.
    </p>

    <ul class="lista-avisos" th:unless="${#lists.isEmpty(avisos)}">
        <li class="card" th:each="aviso : ${avisos}">
            <span class="selo selo--tipo" th:text="${aviso.tipo().rotulo}">Tipo</span>
            <h2 class="card__titulo">
                <a th:href="@{/avisos/{id}(id=${aviso.id()})}" th:text="${aviso.titulo()}">Título do aviso</a>
            </h2>
            <p class="card__meta">
                <span th:text="${aviso.escopo()}">Turma</span>
                <span th:if="${aviso.espaco() != null}">
                    · <span th:text="${aviso.espaco()}">Sala</span>
                </span>
                · <span th:text="${aviso.criadoEmFormatado()}">01/01/2026 08:00</span>
            </p>
            <p class="card__meta" th:if="${aviso.confirmacoes() > 0}"
               th:text="${aviso.confirmacoes() == 1 ? '1 pessoa confirmou' : aviso.confirmacoes() + ' pessoas confirmaram'}">
                2 pessoas confirmaram
            </p>
        </li>
    </ul>

</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>

</body>
</html>
