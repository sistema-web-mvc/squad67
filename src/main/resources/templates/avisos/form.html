<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<!-- Formulário usado para CRIAR (avisoForm.id nulo) e para EDITAR (avisoForm.id preenchido). -->
<head th:replace="~{fragments/layout :: head(${avisoForm.id == null ? 'Novo aviso' : 'Editar aviso'})}"></head>
<body class="d-flex flex-column min-vh-100">

<a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>

<header th:replace="~{fragments/layout :: cabecalho('avisos')}"></header>

<div th:replace="~{fragments/layout :: mensagens}"></div>

<main id="conteudo" class="container py-4 flex-grow-1">

    <h1 class="h2 mb-4" th:text="${avisoForm.id == null ? 'Novo aviso' : 'Editar aviso'}">Novo aviso</h1>

    <!--
      th:object liga o formulário ao objeto avisoForm do controller;
      th:field="*{campo}" preenche name, id e value de cada campo (e mantém o que a pessoa digitou quando há erro);
      th:errors mostra a mensagem de erro do campo; th:errorclass pinta o campo de vermelho.
    -->
    <form th:object="${avisoForm}" method="post" novalidate
          th:action="${avisoForm.id == null} ? @{/avisos} : @{/avisos/{id}/editar(id=${avisoForm.id})}">

        <div class="alert alert-danger" role="alert" th:if="${#fields.hasErrors('*')}">
            Corrija os campos destacados abaixo e envie de novo.
        </div>

        <div class="row g-3">

            <div class="col-md-4">
                <label for="tipo" class="form-label">Tipo do aviso</label>
                <select class="form-select" th:field="*{tipo}" th:errorclass="is-invalid"
                        aria-describedby="erro-tipo">
                    <option value="">Escolha...</option>
                    <option th:each="t : ${tipos}" th:value="${t}" th:text="${t.rotulo}">Tipo</option>
                </select>
                <div class="invalid-feedback" id="erro-tipo" th:errors="*{tipo}">Erro</div>
            </div>

            <div class="col-md-8">
                <label for="titulo" class="form-label">Título</label>
                <input type="text" class="form-control" th:field="*{titulo}" th:errorclass="is-invalid"
                       maxlength="150" aria-describedby="erro-titulo">
                <div class="invalid-feedback" id="erro-titulo" th:errors="*{titulo}">Erro</div>
            </div>

            <div class="col-12">
                <label for="descricao" class="form-label">Descrição <span class="text-body-secondary">(opcional)</span></label>
                <textarea class="form-control" rows="4" th:field="*{descricao}" th:errorclass="is-invalid"
                          maxlength="1000" aria-describedby="erro-descricao"></textarea>
                <div class="invalid-feedback" id="erro-descricao" th:errors="*{descricao}">Erro</div>
            </div>

            <div class="col-md-6">
                <label for="campusId" class="form-label">Campus</label>
                <select class="form-select" th:field="*{campusId}" th:errorclass="is-invalid"
                        aria-describedby="erro-campusId">
                    <option value="">Escolha...</option>
                    <option th:each="o : ${campi}" th:value="${o.id()}" th:text="${o.rotulo()}">Campus</option>
                </select>
                <div class="invalid-feedback" id="erro-campusId" th:errors="*{campusId}">Erro</div>
            </div>

            <div class="col-md-6">
                <label for="autorId" class="form-label">Publicado por</label>
                <select class="form-select" th:field="*{autorId}" th:errorclass="is-invalid"
                        aria-describedby="erro-autorId">
                    <option value="">Escolha...</option>
                    <option th:each="o : ${autores}" th:value="${o.id()}" th:text="${o.rotulo()}">Pessoa</option>
                </select>
                <div class="invalid-feedback" id="erro-autorId" th:errors="*{autorId}">Erro</div>
            </div>

            <div class="col-md-6">
                <label for="turmaId" class="form-label">Turma <span class="text-body-secondary">(opcional)</span></label>
                <select class="form-select" th:field="*{turmaId}" th:errorclass="is-invalid"
                        aria-describedby="ajuda-turmaId erro-turmaId">
                    <option value="">Todo o campus</option>
                    <option th:each="o : ${turmas}" th:value="${o.id()}" th:text="${o.rotulo()}">Turma</option>
                </select>
                <div class="form-text" id="ajuda-turmaId">Sem turma, o aviso vale para o campus inteiro.</div>
                <div class="invalid-feedback" id="erro-turmaId" th:errors="*{turmaId}">Erro</div>
            </div>

            <div class="col-md-6">
                <label for="espacoId" class="form-label">Local <span class="text-body-secondary">(opcional)</span></label>
                <select class="form-select" th:field="*{espacoId}" th:errorclass="is-invalid"
                        aria-describedby="erro-espacoId">
                    <option value="">Sem local específico</option>
                    <option th:each="o : ${espacos}" th:value="${o.id()}" th:text="${o.rotulo()}">Local</option>
                </select>
                <div class="invalid-feedback" id="erro-espacoId" th:errors="*{espacoId}">Erro</div>
            </div>

            <div class="col-md-6">
                <label for="expiraEm" class="form-label">Vale até <span class="text-body-secondary">(opcional)</span></label>
                <input type="datetime-local" class="form-control" th:field="*{expiraEm}" th:errorclass="is-invalid"
                       aria-describedby="ajuda-expiraEm erro-expiraEm">
                <div class="form-text" id="ajuda-expiraEm">Deixe em branco se o aviso não tem prazo.</div>
                <div class="invalid-feedback" id="erro-expiraEm" th:errors="*{expiraEm}">Erro</div>
            </div>

        </div>

        <div class="d-flex flex-wrap gap-2 mt-4">
            <button type="submit" class="btn btn-primary"
                    th:text="${avisoForm.id == null ? 'Criar aviso' : 'Salvar alterações'}">Salvar</button>
            <a class="btn btn-outline-secondary"
               th:href="${avisoForm.id == null} ? @{/avisos} : @{/avisos/{id}(id=${avisoForm.id})}">Cancelar</a>
        </div>

    </form>

</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>

<script th:replace="~{fragments/layout :: scripts}"></script>

</body>
</html>
