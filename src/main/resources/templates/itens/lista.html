<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Itens</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-5">
    <div class="container">
        <h2 class="mb-4">Lista de Itens (Semana 2 / E1)</h2>
        <table class="table table-striped table-bordered bg-white shadow-sm">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Preço</th>
                    <th>Data</th>
                    <th>Ativo</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="item : ${itens}">
                    <td th:text="${item.id}">1</td>
                    <td th:text="${item.nome}">Nome</td>
                    <td th:text="${'R$ ' + item.preco}">0.00</td>
                    <td th:text="${item.dataCadastro}">2026-11-12</td>
                    <td th:text="${item.ativo ? 'Sim' : 'Não'}">Sim</td>
                    <td>
                        <a th:href="@{/itens/{id}(id=${item.id})}" class="btn btn-sm btn-info text-white">Detalhes</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
